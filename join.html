<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Closed alpha: keep it out of search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Join the alpha · guardian</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpolygon points=%228,1 15,8 8,15 1,8%22 fill=%22%2338d6e8%22/%3E%3C/svg%3E">
  <style>
    :root { --bg: #07090f; --card: #0b0f18; --line2: #2a3850; --text: #d8e3ef; --muted: #7d8ba0; --accent: #38d6e8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
    button, input { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    .page { max-width: 420px; margin: 0 auto; padding: 40px 16px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 6px; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 12px rgba(56, 214, 232, 0.45); }
    .sub { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-bottom: 28px; }
    .step { font-size: 13px; color: var(--muted); }
    .step p { margin: 0 0 12px; }
    .step strong { color: var(--text); }
    form, .signin-providers { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
    input { background: var(--card); border: 1px solid var(--line2); border-radius: 4px; padding: 6px 10px; font-size: 13px; min-width: 0; flex: 1; color-scheme: dark; }
    .act-retry { background: var(--card); border: 1px solid var(--line2); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
    .act-retry:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .note { margin-top: 14px; font-size: 12px; color: var(--muted); }
    .note.err { color: #e0443e; }
    .who { margin-top: 28px; font-size: 11px; color: var(--muted); }
    .who button { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 11px; }
    /* ---- Guardians (account "link" / "relink") ---- */
    .g-box { margin-top: 20px; padding: 12px; background: var(--card); border: 1px solid var(--line2); border-radius: 4px; text-align: left; }
    .g-box h2 { margin: 0 0 6px; font-size: 12px; font-weight: normal; letter-spacing: 2px; text-transform: uppercase; color: var(--text); }
    .g-box p { margin: 0 0 4px; }
    .g-code { text-transform: uppercase; letter-spacing: 2px; }
    .g-pic { width: 40px; height: 40px; image-rendering: pixelated; vertical-align: middle; }
    .art-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .art-grid button { padding: 2px; background: none; border: 1px solid var(--line2); border-radius: 4px; cursor: pointer; }
    .art-grid button[aria-pressed="true"] { border-color: var(--accent, #4fd1ff); }
    .art-grid button:disabled { opacity: .35; cursor: default; }
    .art-grid img { width: 48px; height: 48px; image-rendering: pixelated; display: block; }
    .mem-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
    .mem-table th, .mem-table td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line2); vertical-align: top; }
    .mem-table th { color: var(--muted); font-weight: normal; letter-spacing: 1px; text-transform: uppercase; font-size: 11px; }
    .mem-table td { color: var(--text); }
    .mem-table .act-retry { padding: 2px 8px; font-size: 11px; }
    .mem-table form { margin-top: 6px; justify-content: flex-start; }
    /* A hover / tap help icon: <span class="info" tabindex="0" role="note" aria-label="...">ⓘ<span class="info-text">...</span></span> */
    .info { position: relative; display: inline-block; margin-left: 6px; color: var(--muted, #8a96ad); cursor: help; font-size: 12px; outline: none; }
    .info .info-text { display: none; position: absolute; left: 50%; top: 125%; transform: translateX(-50%); z-index: 20;
      width: max-content; max-width: 240px; padding: 6px 9px; border-radius: 6px; background: #0b1220; border: 1px solid #22304a;
      color: #cfd8e6; font-size: 11px; line-height: 1.4; text-align: left; white-space: normal; font-weight: normal; letter-spacing: 0; }
    .info:hover .info-text, .info:focus .info-text { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</head>
<body>
  <div class="page">
    <h1>guardian</h1>
    <div class="sub">closed alpha</div>

    <div class="step" id="signin" hidden>
      <p>Sign in</p>
      <div id="signinBox"></div>
    </div>

    <!-- The age screen: neutral on purpose (no hint of the answer that gets in). -->
    <div class="step" id="age" hidden>
      <p>What's your date of birth?</p>
      <form id="ageForm">
        <input id="ageDate" type="date" required aria-label="date of birth" min="1900-01-01">
        <button class="act-retry" type="submit">Continue</button>
      </form>
    </div>

    <div class="step" id="done" hidden></div>

    <!-- A member's Guardians: link one by the code it shows, or move one to new hardware. -->
    <div class="step" id="guardians" hidden>
      <div class="g-box" id="linkBox">
        <h2>Link a Guardian<span class="info" tabindex="0" role="note" aria-label="The code on your Guardian: Settings > Register.">ⓘ<span class="info-text">The code on your Guardian: Settings > Register.</span></span></h2>
        <form id="linkForm">
          <input id="linkCode" class="g-code" required placeholder="ABCD-EFGH" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="code from your Guardian">
          <button class="act-retry" type="submit">Link</button>
        </form>
      </div>
      <div class="g-box">
        <h2>Your Guardians <span id="gCount"></span></h2>
        <table class="mem-table">
          <thead><tr><th></th><th>Guardian</th><th>Status</th><th>Since</th><th></th></tr></thead>
          <tbody id="gRows"></tbody>
        </table>
      </div>
    </div>

    <div class="note" id="note" hidden></div>
    <div class="who" id="who" hidden><span id="whoEmail"></span> · <button id="signOut">sign out</button></div>
  </div>

  <script>
    // The join flow (plan: .agents/tasks/online-boards-and-registration/plan.md):
    // sign in -> the age screen (once) -> the join link's token -> a member.
    // The token arrives in the link's hash (#t=..., never sent to a server
    // until we post it) and is kept in this browser until it's used, so it
    // survives the trip out to the sign-in email and back.
    const $ = id => document.getElementById(id);
    const TOKEN_STORE = 'guardianJoinToken';
    const hashToken = new URLSearchParams(location.hash.slice(1)).get('t');
    if (hashToken) {
      localStorage.setItem(TOKEN_STORE, hashToken);
      history.replaceState(null, '', location.pathname + location.search);
    }

    function note(text, isError) {
      $('note').textContent = text || '';
      $('note').hidden = !text;
      $('note').classList.toggle('err', !!isError);
    }
    function show(step, text) {
      for (const id of ['signin', 'age', 'done', 'guardians']) $(id).hidden = id !== step;
      if (step === 'done') $('done').textContent = text;
    }
    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    };

    // ---- Guardians (account "link" / "relink") ----
    const G_STATUS = { active: 'active', locked: 'on hold', revoked: 'turned off' };
    const LINK_ERRORS = {
      'bad code': "That code didn't work. Get a new one on the Guardian.",
      'already registered': 'That Guardian is registered already.',
      full: "You've linked as many Guardians as allowed.",
      'not a member': "You're not in the alpha right now.",
      'no such guardian': "That Guardian isn't yours any more.",
      revoked: "That Guardian was turned off.",
    };
    // "abcd efgh" / "abcdefgh" -> "ABCD-EFGH" (the server takes either; this is for the eye).
    const tidyCode = s => { const c = s.toUpperCase().replace(/[\s-]/g, ''); return c.length === 8 ? c.slice(0, 4) + '-' + c.slice(4) : s.trim(); };

    // Pictures from the catalog (account GET "art": {id, name, owned}); the pick
    // reaches the Guardian with its next node list (account "set_art").
    let artList = [];
    function picker(g, td) {
      const grid = el('div', 'art-grid');
      const chosen = g.art_choice || g.art;
      for (const a of artList) {
        const b = Object.assign(el('button'), { type: 'button', title: a.name, disabled: !a.owned });
        b.setAttribute('aria-pressed', String(a.id === chosen));
        b.append(Object.assign(el('img'), { src: 'art/partners/' + a.id + '.png', alt: a.name }));
        b.onclick = async () => {
          const res = await guardianAuth.call('account', { method: 'POST', body: { op: 'set_art', handle: g.handle, art: a.id } });
          if (!res.ok) { note("Couldn't change it: " + (res.out.error || 'try again'), true); return; }
          note(`${a.name} picked. Your Guardian switches when it's next online.`);
          refresh();
        };
        grid.append(b);
      }
      td.append(grid);
    }

    function renderGuardians(list, cap) {
      $('gCount').textContent = cap ? `(${list.filter(g => g.status !== 'revoked').length} of ${cap})` : '';
      $('linkBox').hidden = list.filter(g => g.status !== 'revoked').length >= cap;
      const body = $('gRows');
      body.replaceChildren();
      for (const g of list) {
        const tr = el('tr');
        const acts = el('td');
        if (g.status !== 'revoked') {
          const move = el('button', 'act-retry', 'Move');
          move.type = 'button';
          move.onclick = () => {
            move.hidden = true;
            const form = el('form');
            const input = Object.assign(el('input', 'g-code'), { required: true, placeholder: 'ABCD-EFGH', maxLength: 12, autocomplete: 'off', spellcheck: false });
            input.setAttribute('aria-label', 'code from the new Guardian');
            const go = Object.assign(el('button', 'act-retry', 'Move'), { type: 'submit' });
            const cancel = Object.assign(el('button', 'act-retry', 'Cancel'), { type: 'button' });
            cancel.onclick = () => { form.remove(); move.hidden = false; };
            form.onsubmit = async e => {
              e.preventDefault();
              if (!confirm(`Move ${g.public_name || 'this Guardian'} to the new device?`)) return;
              go.disabled = true;
              const res = await guardianAuth.call('account', { method: 'POST', body: { op: 'relink', handle: g.handle, code: input.value } });
              go.disabled = false;
              if (!res.ok) { note(LINK_ERRORS[res.out.error] || "Couldn't move it: " + (res.out.error || 'try again'), true); return; }
              note('Moved.');
              refresh();
            };
            input.onblur = () => { input.value = tidyCode(input.value); };
            form.append(input, go, cancel);
            acts.append(form);
            input.focus();
          };
          acts.append(move);
          if (artList.length) {
            const pic = el('button', 'act-retry', 'Picture');
            pic.type = 'button';
            pic.onclick = () => { pic.hidden = true; picker(g, acts); };
            acts.append(pic);
          }
        }
        const shown = g.art_choice || g.art;
        const picTd = el('td');
        if (shown) picTd.append(Object.assign(el('img', 'g-pic'), { src: 'art/partners/' + shown + '.png', alt: '' }));
        const pending = g.art_choice && g.art_choice !== g.art;
        tr.append(picTd, el('td', null, (g.public_name || '(no name yet)') + (pending ? ' (new picture on its way)' : '')),
          el('td', null, G_STATUS[g.status] || g.status), el('td', null, g.registered_day || ''), acts);
        body.append(tr);
      }
      if (!list.length) {
        const td = el('td', null, 'None yet.');
        td.colSpan = 5;
        const tr = el('tr');
        tr.append(td);
        body.append(tr);
      }
    }
    $('linkCode').onblur = () => { $('linkCode').value = tidyCode($('linkCode').value); };
    $('linkForm').onsubmit = async e => {
      e.preventDefault();
      const btn = $('linkForm').querySelector('button');
      btn.disabled = true;
      const res = await guardianAuth.call('account', { method: 'POST', body: { op: 'link', code: $('linkCode').value } });
      btn.disabled = false;
      if (!res.ok) { note(LINK_ERRORS[res.out.error] || "Couldn't link it: " + (res.out.error || 'try again'), true); return; }
      $('linkCode').value = '';
      note(`Linked ${res.out.guardian.public_name || 'your Guardian'}.`);
      refresh();
    };

    async function refresh() {
      const s = guardianAuth.session();
      $('who').hidden = !s;
      $('whoEmail').textContent = guardianAuth.email();
      if (!s) {
        guardianAuth.renderSignIn($('signinBox'), note);
        show('signin');
        return;
      }
      const { ok, out } = await guardianAuth.call('account');
      if (!ok) { show('done', ''); note("Couldn't load your account: " + (out.error || 'try again'), true); return; }
      const a = out.account;
      if (a.revoked) return show('done', 'Your access was turned off.');
      if (a.adult === null) return show('age');
      if (!a.adult) return show('done', "Sorry, you can't join the alpha.");
      if (a.member) {
        localStorage.removeItem(TOKEN_STORE);
        artList = out.art || [];
        renderGuardians(out.guardians || [], out.guardian_cap || 0);
        return show('guardians');
      }
      const token = localStorage.getItem(TOKEN_STORE);
      if (!token) return show('done', 'Open your invite link to join.');
      const res = await guardianAuth.call('account', { method: 'POST', body: { op: 'join', token } });
      if (res.ok) { localStorage.removeItem(TOKEN_STORE); return refresh(); }
      const why = {
        'bad link': "That invite link has expired.",
        off: 'Joining is closed right now.',
        full: 'The alpha is full right now.',
      }[res.out.error];
      if (res.out.error === 'bad link') localStorage.removeItem(TOKEN_STORE);
      show('done', why || "Couldn't join: " + (res.out.error || 'try again'));
    }

    $('ageDate').max = new Date().toISOString().slice(0, 10);
    $('ageForm').onsubmit = async e => {
      e.preventDefault();
      const res = await guardianAuth.call('account', { method: 'POST', body: { op: 'age', birthdate: $('ageDate').value } });
      if (!res.ok) { note("That date didn't work: " + (res.out.error || 'try again'), true); return; }
      note('');
      refresh();
    };
    $('signOut').onclick = async () => { await guardianAuth.signOut(); note(''); refresh(); };
    guardianAuth.onChange(() => refresh());
    guardianAuth.ready.then(refresh);
  </script>
</body>
</html>
